<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148, 163, 184, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />

  <!-- Subtle Glow Orbs -->
  <circle cx="180" cy="90" r="160" fill="#3B82F6" fill-opacity="0.10" />
  <circle cx="1020" cy="260" r="180" fill="#10B981" fill-opacity="0.08" />

  <!-- Left Icon Emblem -->
  <g transform="translate(64, 78)">
    <rect width="92" height="92" rx="22" fill="url(#accentBlue)" />
    <rect x="3" y="3" width="86" height="86" rx="19" fill="#0B1120" fill-opacity="0.25" />
    <path d="M46 20 L70 68 L56 68 L46 46 L36 68 L22 68 Z" fill="#FFFFFF" />
    <circle cx="46" cy="62" r="5" fill="#34D399" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(182, 78)">
    <rect width="370" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10B981" />
    <text x="30" y="18.5" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="0.6">
      AGENT-FIRST ENGINEERING WORKBENCH · V2.4
    </text>
  </g>

  <!-- Main Title -->
  <text x="182" y="142" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    Google Antigravity Academy &amp; Studio
  </text>

  <!-- Subtitle -->
  <text x="182" y="176" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500">
    Interactive Mission Control Simulator, FastMCP Builder, Rule Studio &amp; Architect Certification
  </text>

  <!-- Feature Pills Bottom Row -->
  <g transform="translate(64, 226)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="245" height="58" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="18" y="25" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">01 · 8-MODULE CURRICULUM</text>
    <text x="18" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Bilingual RTL Persian + LTR Code</text>

    <!-- Pill 2 -->
    <rect x="262" y="0" width="265" height="58" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="280" y="25" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">02 · LIVE ARCHITECT STUDIOS</text>
    <text x="280" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Mission Control, Rules &amp; FastMCP</text>

    <!-- Pill 3 -->
    <rect x="544" y="0" width="265" height="58" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="562" y="25" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">03 · XP, LEVELS &amp; TROPHIES</text>
    <text x="562" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Daily Study Planner &amp; PDF Certs</text>

    <!-- Pill 4 -->
    <rect x="826" y="0" width="246" height="58" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="844" y="25" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">04 · CLOUD &amp; PWA READY</text>
    <text x="844" y="44" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">Firebase Sync &amp; Offline Service</text>
  </g>
</svg>
